[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crash-fix-tool"
version = "0.1.0"
description = "Automated crash fix and PR generation from stack trace portal fingerprints"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0",
    "requests>=2.28",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.10",
    "responses>=0.23",
]

[project.scripts]
crash-fix = "crash_fix.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
